<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market data: the business behind the demo</title>
<style>
:root{--bg:#fbfaf7;--ink:#22211e;--muted:#6b6963;--line:#c9c6bd;--card:#ffffff;
--p-fill:#EEEDFE;--p-line:#534AB7;--p-ink:#3C3489;--p-sub:#534AB7;
--d-fill:#E1F5EE;--d-line:#0F6E56;--d-ink:#085041;--d-sub:#0F6E56;
--q-fill:#FAECE7;--q-line:#993C1D;--q-ink:#712B13;--q-sub:#993C1D}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--ink:#ecebe6;--muted:#a3a19a;--line:#4a4944;--card:#252523;
--p-fill:#3C3489;--p-line:#AFA9EC;--p-ink:#EEEDFE;--p-sub:#CECBF6;
--d-fill:#085041;--d-line:#5DCAA5;--d-ink:#E1F5EE;--d-sub:#9FE1CB;
--q-fill:#712B13;--q-line:#F0997B;--q-ink:#FAECE7;--q-sub:#F5C4B3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px}
.diagram{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
.p rect{fill:var(--p-fill);stroke:var(--p-line)}.p .t{fill:var(--p-ink)}.p .s{fill:var(--p-sub)}
.d rect{fill:var(--d-fill);stroke:var(--d-line)}.d .t{fill:var(--d-ink)}.d .s{fill:var(--d-sub)}
.q rect{fill:var(--q-fill);stroke:var(--q-line)}.q .t{fill:var(--q-ink)}.q .s{fill:var(--q-sub)}
.t{font-size:15px;font-weight:600}.s{font-size:13px}
.arr{stroke:var(--muted);stroke-width:1.5;fill:none}
.lead-line{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;fill:none}
.al{fill:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td:first-child{color:var(--muted);width:28px}
.note{color:var(--muted);font-size:14px;margin-top:12px}
.bar{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--p-line)}button:disabled{opacity:.5;cursor:default}
.link{cursor:pointer}.link:hover rect,.link:focus rect{stroke-width:2.5}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
</style>
</head>
<body>
<main>
<div class="crumbs"><a href="./">DataBP demo</a> / <span id="crumbs"></span></div>
<h1 id="title"></h1>
<p class="lead" id="lead"></p>
<div class="bar"><button id="up" type="button">Up one</button><button id="home" type="button">Start</button></div>
<div class="diagram" id="diagram"></div>
<div class="legend"><span><span class="sw" style="background:var(--p-fill);border:1px solid var(--p-line)"></span>The parties</span><span><span class="sw" style="background:var(--d-fill);border:1px solid var(--d-line)"></span>The documents</span><span><span class="sw" style="background:var(--q-fill);border:1px solid var(--q-line)"></span>The question</span></div>
<table id="facts"><thead><tr id="head"></tr></thead><tbody></tbody></table>
<p class="note" id="note"></p>
</main>

width=\"140\" height=\"56\" rx=\"8\"/><text class=\"t\" x=\"110\" y=\"82\" text-anchor=\"middle\">License</text><text class=\"s\" x=\"110\" y=\"102\" text-anchor=\"middle\">Exchange grants</text></g><g class=\"d\"><rect x=\"193\" y=\"60\" width=\"140\" height=\"56\" rx=\"8\"/><text class=\"t\" x=\"263\" y=\"82\" text-anchor=\"middle\">Entitlement</text><text class=\"s\" x=\"263\" y=\"102\" text-anchor=\"middle\">Vendor permits</text></g><g class=\"d link\" data-go=\"counting\" tabindex=\"0\" role=\"link\"><rect x=\"346\" y=\"60\" width=\"140\" height=\"56\" rx=\"8\"/><text class=\"t\" x=\"416\" y=\"82\" text-anchor=\"middle\">Usage report</text><text class=\"s\" x=\"416\" y=\"102\" text-anchor=\"middle\">Units each month ›</text></g><g class=\"d\"><rect x=\"499\" y=\"60\" width=\"140\" height=\"56\" rx=\"8\"/><text class=\"t\" x=\"569\" y=\"82\" text-anchor=\"middle\">Invoice</text><text class=\"s\" x=\"569\" y=\"102\" text-anchor=\"middle\">Amount billed</text></g></svg>", "head": ["#", "Document", "What it is"], "facts": [["License", "The right an exchange grants in its market data agreement: limited, revocable, for the agreement's term"], ["Entitlement", "A vendor's permitting a subscriber to receive data, through an entitlement control the exchange approves"], ["Usage report", "The monthly count of units per product, per location or subscriber, sent to the exchange"], ["Invoice", "What the subscriber was billed: product, units, unit price, amount"], ["Who reads them", "In the demo, one data provider's data business team, seeing only its own subscribers"]], "note": "Sources: the course log, entries 314, 316 and 318 (MEMX Market Data Agreement, section 4; an NYSE filing of 2010-05-12; Euronext Reporting Guidelines v1.6, section 2.3); the design document, decision D-1, for who reads them. The invoice's meaning is the design's own, not an industry source."}, "counting": {"level": 2, "parent": "documents", "title": "Counting the use", "lead": "Use is measured in a un function go(id){if(location.hash!=="#"+id)location.hash=id;else render()}
function current(){const h=location.hash.replace("#","");return V[h]?h:"business"}
function path(id){const p=[];for(let c=id;c;c=V[c].parent)p.unshift(c);return p}
function render(){
 const id=current(),v=V[id];
 document.getElementById("title").textContent=v.title;
 document.getElementById("lead").textContent=v.lead;
 document.getElementById("crumbs").textContent=path(id).map(c=>"Level "+V[c].level+": "+V[c].title).join(" › ");
 const dg=document.getElementById("diagram");dg.innerHTML=v.svg;
 dg.querySelectorAll("[data-go]").forEach(g=>{g.addEventListener("click",()=>go(g.dataset.go));g.addEventListener("keydown",e=>{if(e.key==="Enter")go(g.dataset.go)})});
 const hr=document.getElementById("head");hr.innerHTML="";v.head.forEach(h=>{const th=document.createElement("th");th.textContent=h;hr.appendChild(th)});
 const tb=document.querySelector("#facts tbody");tb.innerHTML="";
 v.facts.forEach((f,i)=>{const tr=document.createElement("tr");[i+1,f[0],f[1]].forEach((c,j)=>{const td=document.createElement("td");td.textContent=c;if(j===1)td.style.fontWeight="600";tr.appendChild(td)});tb.appendChild(tr)});
 document.getElementById("note").textContent=v.note;
 document.getElementById("up").disabled=!v.parent;
 document.title="Market data: "+v.title;
}
document.getElementById("up").addEventListener("click",()=>{const p=V[current()].parent;if(p)go(p)});
document.getElementById("home").addEventListener("click",()=>go("business"));
window.addEventListener("hashchange",render);
render();
</script>
